<!doctype html>
<html lang="kr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/static/image/niniz-bbanya.jpg" />
    <link rel="shortcut icon" href="/static/image/niniz-bbanya.jpg" />
    <link rel="stylesheet" href="/static/css/normalize.css" />
    <link rel="stylesheet" href="/static/css/letters.css" />
    <link rel="stylesheet" href="/static/css/style.css" />
    <title>fixalot.github.io</title>
  </head>
  <body>
    <main class="align-center rp-page">
      <header class="rp-header">
        <h1>🖐️ 당번 뽑기</h1>
        <p class="rp-subtitle">이름을 공백으로 구분헤서 입력하고 뽑끼 버튼을 눌러오</p>
      </header>

      <section class="card rp-input-card">
        <input type="text" id="txtInpt1" autofocus tabindex="1" placeholder="공백으로 구분하새오 (예: 김 이 박)" />
        <button class="btns effect-push rp-pick-button" id="btn1" type="button">뽑끼</button>
        <button class="btns effect-push rp-save-button" tabindex="2" type="button" id="btn2">명단 저장하기애오</button>
        <div class="result hidden" id="result">
          <ul class="rp-result-list" id="resultList"></ul>
        </div>
      </section>

      <div class="rp-grid">
        <section class="card">
          <h2 class="rp-section-title">지난 당번</h2>
          <ul class="rp-history-list" id="histories"></ul>
        </section>
        <section class="card">
          <h2 class="rp-section-title">저장된 명단</h2>
          <ul class="rp-save-list" id="saveList"></ul>
        </section>
      </div>
    </main>
    <footer class="page-footer">
      <p>
        made by fixalot
        <a
          class="footer-icon-link"
          href="https://github.com/fix-a-lot/fix-a-lot.github.io"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub"
        >
          <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">

              d="M6.766 11.328c-2.063-.25-3.516-1.734-3.516-3.656 0-.781.281-1.625.75-2.188-.203-.515-.172-1.609.063-2.062.625-.078 1.468.25 1.968.703.594-.187 1.219-.281 1.985-.281.765 0 1.39.094 1.953.265.484-.437 1.344-.765 1.969-.687.218.422.25 1.515.046 2.047.5.593.766 1.39.766 2.203 0 1.922-1.453 3.375-3.547 3.64.531.344.89 1.094.89 1.954v1.625c0 .468.391.734.86.547C13.781 14.359 16 11.53 16 8.03 16 3.61 12.406 0 7.984 0 3.563 0 0 3.61 0 8.031a7.88 7.88 0 0 0 5.172 7.422c.422.156.828-.125.828-.547v-1.25c-.219.094-.5.156-.75.156-1.031 0-1.64-.562-2.078-1.609-.172-.422-.36-.672-.719-.719-.187-.015-.25-.093-.25-.187 0-.188.313-.328.625-.328.453 0 .844.281 1.25.86.313.452.64.655 1.031.655s.641-.14 1-.5c.266-.265.47-.5.657-.656"
            />
          </svg>
        </a>
      </p>
    </footer>

    <script type="module" src="/static/js/random-pick.js"></script>
  </body>
</html>
